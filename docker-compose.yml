services:
  backend:
    container_name: KPD-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.pub
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - KPD-internal
      - KPD-app
    restart: unless-stopped

  frontend:
    container_name: KPD-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.pub
    ports:
      - "3001:80"
    env_file:
      - ./backend/.env
    networks:
      - KPD-public
      - KPD-app
    restart: unless-stopped

  db:
    container_name: KPD-db
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - KPD-pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - KPD-internal
    restart: unless-stopped

  adminer:
    container_name: KPD-adminer
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - KPD-internal
      - KPD-public
    restart: unless-stopped

volumes:
  KPD-pgdata:

networks:
  KPD-internal:
    driver: bridge
  KPD-public:
    driver: bridge
  KPD-app:
    driver: bridge
