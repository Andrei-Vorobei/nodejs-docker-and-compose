services:
  backend:
    container_name: KPD-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.pub
    ports:
      - "${BACKEND_PORT}:3001"
    env_file:
      - ./backend/.env
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - KPD-internal
      - KPD-app
    restart: unless-stopped

  frontend:
    container_name: KPD-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.pub
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - KPD-public
      - KPD-app
    restart: unless-stopped

  db-postgres:
    container_name: KPD-db
    image: postgres:14-alpine
    env_file:
      - .env
    volumes:
      - KPD-pgdata:${PGDATA}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U super-user -d postgres-kpd"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - KPD-internal
    restart: unless-stopped

  adminer:
    container_name: KPD-adminer
    image: adminer
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - KPD-internal
      - KPD-public
    restart: unless-stopped

volumes:
  KPD-pgdata:

networks:
  KPD-internal:
    driver: bridge
  KPD-public:
    driver: bridge
  KPD-app:
    driver: bridge
