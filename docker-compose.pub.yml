services:
  backend:
    container_name: backend-opti
    restart: unless-stopped
    build:
      context: backend
      dockerfile: Dockerfile.pub
    image: dockerjozef/backend-opti
    ports:
      - ${BACKEND_PORT}:3000
    env_file: .env
    depends_on:
      db_postgres:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    container_name: frontend-opti
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: Dockerfile.pub
    image: dockerjozef/frontend-opti:0.0.1
    ports:
      - ${FRONTEND_PORT}:80
    env_file: .env
    networks:
      - external_network

  db_postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:14-alpine
    env_file: .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:${PGDATA}
    networks:
      - internal_network

  adminer:
    container_name: adminer
    restart: unless-stopped
    image: adminer
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - internal_network

volumes:
  postgres_data:

networks:
  internal_network:
    driver: bridge
  external_network:
    driver: bridge
